<div class="upload-container">

  <div class="card">
    <h2>📸 Phân tích dinh dưỡng</h2>

    <input type="file" accept="image/*" (change)="onFileSelected($event)" #fileInput hidden>

    <button type="button" (click)="fileInput.click()" class="btn primary">
      Chọn ảnh
    </button>

    <div class="preview-area" *ngIf="imagePreview">
      <img [src]="imagePreview" alt="Preview">
    </div>

    <button *ngIf="imagePreview" (click)="save()" class="btn success">
      Phân tích ảnh
    </button>

    <div *ngIf="resultText" class="result-box">
      <h4>Kết quả phân tích</h4>
      <pre>{{ resultText | json }}</pre>
    </div>

    <button *ngIf="resultText" (click)="makeExcercise()" class="btn warning">
      Tạo bài tập
    </button>

    <div *ngIf="resultExcercise" class="table-container">
      <table>
        <thead>
          <tr>
            <th>Bài tập</th>
            <th>Khối lượng</th>
            <th>Đơn vị</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let e of resultExcercise">
            <td>{{ e.Excercise }}</td>
            <td>{{ e.ExcerciseValue }}</td>
            <td>{{ e.Unit }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <button *ngIf="resultExcercise" (click)="viewInvoke()" class="btn dark">
      Xem hóa đơn
    </button>

  </div>
</div>
