<div class="container mt-4">

  <h3 class="mb-3">📸 Scan History</h3>

  <!-- FILTER -->
  <div class="card p-3 mb-3 shadow-sm">
    <div class="row g-2">

      <div class="col-md-3">
        <label>Start Date</label>
        <input type="date" class="form-control" [(ngModel)]="filter.startDate" [max]="filter.endDate">
      </div>

      <div class="col-md-3">
        <label>End Date</label>
        <input type="date" class="form-control" [(ngModel)]="filter.endDate" [min]="filter.startDate">
      </div>

      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" (click)="search()">
          🔍 Search
        </button>
      </div>

    </div>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="text-center">
    Loading...
  </div>

  <!-- TABLE -->
  <div class="card shadow-sm" *ngIf="!loading">

    <table class="table table-hover mb-0">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Image</th>
          <th>Date</th>
          <th>Confidence</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of invokes; let i = index">
          <td>{{i + 1}}</td>

          <td>
            <img [src]="item.imageUrl" width="80" class="rounded">
          </td>

          <td>
            {{item.createdAt | date:'dd/MM/yyyy HH:mm'}}
          </td>

          <td>
            <span class="badge bg-success" *ngIf="item.aiConfidence >= 80">High</span>
            <span class="badge bg-warning" *ngIf="item.aiConfidence < 80 && item.aiConfidence >= 50">Medium</span>
            <span class="badge bg-danger" *ngIf="item.aiConfidence < 50">Low</span>
          </td>

          <td>
            <button class="btn btn-sm btn-outline-primary"
                    (click)="goDetail(item.scanImageId)">
              View
            </button>
          </td>
        </tr>

        <tr *ngIf="invokes.length === 0">
          <td colspan="5" class="text-center">No data</td>
        </tr>
      </tbody>
    </table>

  </div>

  <!-- PAGINATION -->
  <div class="d-flex justify-content-between mt-3">
    <button class="btn btn-secondary" (click)="prevPage()">Prev</button>
    <span>Page {{filter.page}}</span>
    <button class="btn btn-secondary" (click)="nextPage()">Next</button>
  </div>

</div>
