<div class="container mt-4">

  <h3 class="mb-3">📸 Lịch sử quét</h3>

  <!-- FILTER -->
  <div class="card p-3 mb-3 shadow-sm">
    <div class="row g-2">

      <div class="col-md-3">
        <label>Ngày bắt đầu</label>
        <input type="date" class="form-control" [(ngModel)]="filter.startDate" [max]="filter.endDate">
      </div>

      <div class="col-md-3">
        <label>Ngày kết thúc</label>
        <input type="date" class="form-control" [(ngModel)]="filter.endDate" [min]="filter.startDate">
      </div>

      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" (click)="search()">
          🔍 Tìm kiếm
        </button>
      </div>

    </div>
  </div>

  <!-- LOADING -->
  <div *ngIf="loading" class="text-center">
    Đang tải dữ liệu...
  </div>

  <!-- TABLE -->
  <div class="card shadow-sm" *ngIf="!loading">

    <table class="table table-hover mb-0">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Ảnh</th>
          <th>Ngày</th>
          <th>Tỉ lệ hoàn thành</th>
          <th>Hành động</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of invokes; let i = index">
          <td>{{i + 1}}</td>

          <td>
            <img [src]="item.imageUrl" width="80" class="rounded">
          </td>

          <td>
            {{item.createdAt | date:'dd/MM/yyyy HH:mm'}}
          </td>

          <td>
            {{getCompletion(item)}}
          </td>

          <td>
            <button class="btn btn-sm btn-outline-primary"
                    (click)="goDetail(item.scanImageId)">
              View
            </button>
          </td>
        </tr>

        <tr *ngIf="invokes.length === 0">
          <td colspan="5" class="text-center">Không có dữ liệu</td>
        </tr>
      </tbody>
    </table>

  </div>

  <!-- PAGINATION -->
  <div class="d-flex justify-content-between mt-3">
    <button class="btn btn-secondary" (click)="prevPage()">Trước</button>
    <span>Page {{filter.page}}</span>
    <button class="btn btn-secondary" (click)="nextPage()">Sau</button>
  </div>

</div>
